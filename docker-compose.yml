services:
  api:
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/quiz.db
    volumes:
      - quizdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  quizdata:
