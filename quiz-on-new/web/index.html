<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUIZ ON | 실시간 퀴즈</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#1d2940;background:#f2f5fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#172b58,#315ad4);color:#fff;padding:30px 20px;text-align:center}header h1{font-size:38px;margin:0}header p{margin:8px 0 0;color:#dce5ff}main{max-width:1100px;margin:24px auto;padding:0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:#fff;color:#233b70;border:1px solid #d6dfee}.tabs button.active{background:#315ad4;color:#fff}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 20px #192e5910;margin-bottom:16px}h2{margin-top:0;font-size:21px}h3{margin:12px 0}input,select{display:block;width:100%;padding:12px;margin:8px 0;border:1px solid #cbd5e4;border-radius:9px;font-size:15px}button{border:0;border-radius:9px;background:#315ad4;color:#fff;padding:11px 15px;cursor:pointer;font-weight:600;margin:4px 4px 4px 0}button:hover{filter:brightness(.94)}button:disabled{opacity:.45;cursor:not-allowed}.danger{background:#d64755}.muted{background:#66758c}.outline{background:#edf2ff;color:#21479d}.item{border:1px solid #dce3ef;border-radius:12px;padding:14px;margin:10px 0}.item p{margin:5px 0}.tiny{font-size:13px;color:#64748b}.bigcode{font-size:34px;font-weight:800;letter-spacing:5px;color:#244bb0}.option{width:100%;text-align:left;background:#edf2ff;color:#1e3c78;padding:15px}.option.selected{background:#315ad4;color:#fff}.pill{display:inline-block;padding:5px 11px;border-radius:30px;background:#e9efff;color:#2549a6;font-size:13px;font-weight:700}.hidden{display:none!important}#notice{position:sticky;bottom:12px;margin:20px auto;max-width:800px;background:#16264a;color:white;border-radius:12px;padding:13px 18px;min-height:45px;box-shadow:0 5px 20px #0002}.ranking{padding-left:26px}.ranking li{padding:8px 4px;border-bottom:1px solid #edf0f6}.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.flex>*{flex:1}.flex button{flex:0 0 auto}@media(max-width:550px){header h1{font-size:30px}.card{padding:16px}}
</style></head><body>
<header><h1>QUIZ ON</h1><p>문제를 만들고, 방을 열고, 함께 도전하세요!</p></header>
<main>
<nav class="tabs"><button class="active" data-tab="manage">퀴즈 제작</button><button data-tab="lobby">방 만들기 / 참가</button><button data-tab="game">퀴즈 대결</button></nav>
<section id="manage" class="panel active"><div class="grid"><div class="card"><h2>퀴즈 만들기</h2><input id="quizTitle" placeholder="퀴즈 제목"><button id="addQuiz">퀴즈 저장</button><h3>내 퀴즈 목록</h3><div id="quizList"></div></div><div class="card"><h2>문제 등록 / 수정</h2><select id="quizSelect"></select><input id="question" placeholder="문제 내용"><input class="opt" placeholder="보기 1"><input class="opt" placeholder="보기 2"><input class="opt" placeholder="보기 3"><input class="opt" placeholder="보기 4"><select id="answer"><option value="">정답 선택</option><option value="1">1번</option><option value="2">2번</option><option value="3">3번</option><option value="4">4번</option></select><button id="saveQuestion">문제 저장</button><button class="muted" id="cancelEdit">수정 취소</button><h3>등록된 문제</h3><div id="questionList"></div></div></div></section>
<section id="lobby" class="panel"><div class="grid"><div class="card"><h2>방장: 퀴즈방 만들기</h2><p class="tiny">퀴즈 제작 탭에서 선택한 퀴즈로 방을 생성합니다.</p><button id="makeRoom">6자리 방 코드 생성</button><p class="bigcode" id="createdCode">------</p><p class="tiny">코드를 참가자에게 알려주세요.</p></div><div class="card"><h2>참가자: 방 입장</h2><input id="joinCode" placeholder="6자리 방 코드" maxlength="6"><input id="nickname" placeholder="닉네임 (1~20자)" maxlength="20"><button id="joinRoom">참가하기</button><button class="danger" id="leaveRoom">방 나가기</button></div></div><div class="card"><h2>대기실</h2><p id="roomSummary">참가한 방이 없습니다.</p><ul id="players"></ul><button class="outline" id="goGame">대결 화면으로 이동</button></div></section>
<section id="game" class="panel"><div class="grid"><div class="card"><h2>퀴즈 대결 <span class="pill" id="gameState">대기</span></h2><p id="gameMeta" class="tiny">방을 만들거나 참가하세요.</p><div id="hostControls"><button id="startGame">퀴즈 시작</button><button id="nextGame">다음 문제</button><button id="finishGame" class="danger">퀴즈 종료</button></div><h3 id="questionText">시작을 기다리는 중...</h3><div id="answerOptions"></div><p id="answerMessage"></p></div><div class="card"><h2>실시간 순위</h2><p id="answeredInfo" class="tiny"></p><ol id="ranking" class="ranking"></ol><button id="newGame" class="outline">새 방 만들기</button></div></div></section>
<div id="notice" role="status">준비 완료</div></main>
<script>
const $=id=>document.getElementById(id);
let quizzes=[], editingId=null, roomCode=sessionStorage.getItem('quiz_room')||'', hostToken=sessionStorage.getItem('quiz_host')||'', playerToken=sessionStorage.getItem('quiz_player')||'', chosenAnswer=null, lastQuestionId=null, lastState=null, pending=false;
const notify=text=>$('notice').textContent=text;
async function api(path,method='GET',payload){const res=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:payload===undefined?undefined:JSON.stringify(payload)});let data;try{data=await res.json()}catch{throw Error('서버 응답을 확인하세요.')}if(!res.ok)throw Error(data.error||'요청 실패');return data}
async function safe(fn){try{await fn()}catch(e){notify(e.message)}}
function tab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function btn(text,fn,cls){const b=node('button',text,cls);b.onclick=()=>safe(fn);return b}
function setRoom(code,host='',player=''){roomCode=code;hostToken=host;playerToken=player;sessionStorage.setItem('quiz_room',code);if(host)sessionStorage.setItem('quiz_host',host);else sessionStorage.removeItem('quiz_host');if(player)sessionStorage.setItem('quiz_player',player);else sessionStorage.removeItem('quiz_player');lastQuestionId=null;chosenAnswer=null;lastState=null}
async function loadQuizzes(){quizzes=await api('/api/quizzes');const sel=$('quizSelect'),before=sel.value;sel.replaceChildren();$('quizList').replaceChildren();for(const q of quizzes){sel.add(new Option(q.title,q.id));const item=node('div',undefined,'item');item.append(node('strong',q.title),node('p',`퀴즈 번호: ${q.id}`,'tiny'),btn('제목 수정',async()=>{const title=prompt('새 제목',q.title);if(title===null)return;await api(`/api/quizzes/${q.id}`,'PUT',{title});notify('제목 수정 완료');await loadQuizzes()},'outline'),btn('삭제',async()=>{if(!confirm('퀴즈와 모든 문제를 삭제할까요?'))return;await api(`/api/quizzes/${q.id}`,'DELETE');notify('퀴즈 삭제 완료');await loadQuizzes()},'danger'));$('quizList').append(item)}if(quizzes.some(q=>String(q.id)===before))sel.value=before;await loadQuestions()}
async function loadQuestions(){const id=$('quizSelect').value;$('questionList').replaceChildren();if(!id)return;const questions=await api(`/api/quizzes/${id}/questions`);for(const q of questions){const item=node('div',undefined,'item');item.append(node('strong',q.question),node('p',[q.option1,q.option2,q.option3,q.option4].map((o,i)=>`${i+1}. ${o}`).join(' / '),'tiny'),node('p',`정답: ${q.answer}번`,'tiny'),btn('수정',async()=>{editingId=q.id;$('question').value=q.question;document.querySelectorAll('.opt').forEach((el,i)=>el.value=q['option'+(i+1)]);$('answer').value=q.answer;notify('내용을 수정한 뒤 문제 저장을 누르세요.');window.scrollTo({top:0,behavior:'smooth'})},'outline'),btn('삭제',async()=>{if(!confirm('이 문제를 삭제할까요?'))return;await api(`/api/questions/${q.id}`,'DELETE');notify('문제 삭제 완료');await loadQuestions()},'danger'));$('questionList').append(item)}}
function clearForm(){editingId=null;$('question').value='';document.querySelectorAll('.opt').forEach(x=>x.value='');$('answer').value=''}
$('addQuiz').onclick=()=>safe(async()=>{const title=$('quizTitle').value.trim();await api('/api/quizzes','POST',{title});$('quizTitle').value='';notify('퀴즈 저장 완료');await loadQuizzes()});
$('quizSelect').onchange=()=>safe(loadQuestions);
$('cancelEdit').onclick=clearForm;
$('saveQuestion').onclick=()=>safe(async()=>{const quizId=$('quizSelect').value;if(!quizId)throw Error('퀴즈를 먼저 생성하세요.');const question=$('question').value.trim(),options=[...document.querySelectorAll('.opt')].map(x=>x.value.trim()),answer=$('answer').value?Number($('answer').value):null;const wasEdit=editingId!==null;await api(wasEdit?`/api/questions/${editingId}`:`/api/quizzes/${quizId}/questions`,wasEdit?'PUT':'POST',{question,options,answer});clearForm();notify(wasEdit?'문제 수정 완료':'문제 등록 완료');await loadQuestions()});
$('makeRoom').onclick=()=>safe(async()=>{const quiz_id=Number($('quizSelect').value);if(!quiz_id)throw Error('퀴즈를 먼저 선택하세요.');const result=await api('/api/rooms','POST',{quiz_id});setRoom(result.code,result.host_token);$('createdCode').textContent=result.code;$('joinCode').value=result.code;notify('방 생성 완료. 참가자에게 코드를 알려주세요.');tab('lobby');await refresh()});
$('joinRoom').onclick=()=>safe(async()=>{const code=$('joinCode').value.trim().toUpperCase(),nickname=$('nickname').value.trim();if(!code||!nickname)throw Error('방 코드와 닉네임을 입력하세요.');const result=await api(`/api/rooms/${encodeURIComponent(code)}/join`,'POST',{nickname});setRoom(result.code,'',result.token);notify(`${nickname}님 참가 완료`);await refresh()});
$('leaveRoom').onclick=()=>safe(async()=>{if(!roomCode||!playerToken)throw Error('참가자만 나갈 수 있습니다.');await api(`/api/rooms/${roomCode}/leave`,'POST',{token:playerToken});setRoom('');$('roomSummary').textContent='참가한 방이 없습니다.';$('players').replaceChildren();$('ranking').replaceChildren();$('answerOptions').replaceChildren();notify('방 나가기 완료')});
$('goGame').onclick=()=>tab('game');
function hostAction(path){return safe(async()=>{if(!roomCode||!hostToken)throw Error('방장만 사용할 수 있습니다.');const result=await api(`/api/rooms/${roomCode}/${path}`,'POST',{host_token:hostToken});notify(result.message);await refresh()})}
$('startGame').onclick=()=>hostAction('start');$('nextGame').onclick=()=>hostAction('next');$('finishGame').onclick=()=>safe(async()=>{if(!confirm('퀴즈를 종료할까요?'))return;await hostAction('finish')});
$('newGame').onclick=()=>{setRoom('');$('createdCode').textContent='------';$('roomSummary').textContent='새 퀴즈방을 만들어 주세요.';$('players').replaceChildren();$('ranking').replaceChildren();$('answerOptions').replaceChildren();tab('lobby');notify('새 방 만들기를 눌러 시작하세요.')};
async function refresh(){if(!roomCode||pending)return;pending=true;try{const [room,game]=await Promise.all([api(`/api/rooms/${roomCode}`),api(`/api/rooms/${roomCode}/game`)]);$('roomSummary').textContent=`${room.quiz_title} | 코드 ${room.code} | ${room.participants.length}명 | ${room.state}`;$('players').replaceChildren(...room.participants.map(p=>node('li',p)));$('gameState').textContent=game.state==='waiting'?'대기':game.state==='playing'?'진행 중':'종료';$('gameMeta').textContent=`방 코드: ${roomCode} · ${game.player_count}명 참가`;$('hostControls').classList.toggle('hidden',!hostToken);$('startGame').disabled=game.state!=='waiting';$('nextGame').disabled=game.state!=='playing';$('finishGame').disabled=game.state==='finished';$('ranking').replaceChildren(...game.ranking.map((p,i)=>node('li',`${i+1}위 ${p.nickname} — ${p.score}점`)));$('answeredInfo').textContent=game.state==='playing'?`현재 문제 제출: ${game.answered} / ${game.player_count}`:'';const q=game.question;if(q){$('questionText').textContent=`${q.number}/${q.total} · ${q.question}`;if(lastQuestionId!==q.id||lastState!==game.state){lastQuestionId=q.id;chosenAnswer=null;$('answerMessage').textContent='정답을 선택하세요.';const container=$('answerOptions');container.replaceChildren();q.options.forEach((option,i)=>{const button=btn(`${i+1}. ${option}`,async()=>{if(!playerToken)throw Error('참가자만 정답을 제출할 수 있습니다.');if(chosenAnswer!==null)throw Error('이미 제출했습니다.');const result=await api(`/api/rooms/${roomCode}/answer`,'POST',{token:playerToken,answer:i+1});chosenAnswer=i+1;$('answerMessage').textContent=result.message;notify(result.message);container.querySelectorAll('button').forEach(b=>b.disabled=true)},'option');container.append(button)})}}else{$('questionText').textContent=game.state==='finished'?'퀴즈 종료! 최종 순위를 확인하세요.':'방장이 시작하기를 기다리는 중...';$('answerOptions').replaceChildren();if(game.state==='finished')$('answerMessage').textContent='수고하셨습니다!'}lastState=game.state}catch(e){notify(e.message)}finally{pending=false}}
if(roomCode){$('joinCode').value=roomCode;if(hostToken)$('createdCode').textContent=roomCode;safe(refresh)}safe(loadQuizzes);setInterval(()=>safe(refresh),2000);
</script></body></html>
